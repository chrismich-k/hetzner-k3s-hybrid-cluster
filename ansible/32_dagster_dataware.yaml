---
# Example: registers the "dataware" code location (private GHCR image,
# built by CI from github_repo_url) with the Dagster platform installed by
# 08_setup_dagster.yaml. This should eventually be replaced by a GitOps
# (ArgoCD) deployment, once one exists - it's the pattern to copy for any
# other code location in the meantime.

- name: Load inventory from Terraform
  import_playbook: playbooks/00_setup_inventory.yaml

- name: Register the "dataware" Dagster code location
  hosts: clusters
  become: true
  environment:
    KUBECONFIG: "{{ custom_kubeconfig }}"
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ custom_kubeconfig }}"
  vars:
    dagster_trino_user: "svc-dbt"
    iceberg_namespace_prod: "dataware"
    dagster_dataware_location_name: "dataware"
    dagster_dataware_image: "ghcr.io/chrismich-k/ktest-app/dagster-dataware"
    dagster_dataware_image_tag: "latest"
    dagster_dataware_grpc_port: 3032
    # entry point into the image - adjust to match the actual Python
    # module/attribute the "dataware" image exposes
    dagster_dataware_grpc_args:
      - "-m"
      - "ktest.dataware.definitions"
  tasks:
    # Dagster is optional in this repo (08_setup_dagster.yaml) - only
    # register this code location if the platform is actually installed.
    - name: Check whether the Dagster platform is installed
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: dagster-dagster-webserver
        namespace: "{{ dagster_namespace }}"
      register: dagster_dataware_platform_info
      failed_when: false

    # RustFS's own internal ClusterIP (plain HTTP - pyiceberg/boto3 has no
    # hard TLS requirement, unlike Trino) if used, otherwise Hetzner Object
    # Storage's real HTTPS endpoint.
    - name: Determine the RustFS/S3 endpoint for the Dataware code location
      ansible.builtin.set_fact:
        dagster_dataware_s3_endpoint: >-
          {{ 'http://rustfs-svc.' ~ rustfs_namespace ~ '.svc.cluster.local:9000'
             if stackable_iceberg_storage_backend == 'rustfs'
             else 'https://' ~ stackable_hetzner_object_storage_host ~ ':' ~ stackable_hetzner_object_storage_port }}

    - name: Register dataware dataware code location
      ansible.builtin.include_role:
        name: dagster_code_location
      vars:
        dagster_code_location_name: "{{ dagster_dataware_location_name }}"
        dagster_code_location_namespace: "{{ dagster_namespace }}"
        dagster_code_location_image: "{{ dagster_dataware_image }}"
        dagster_code_location_image_tag: "{{ dagster_dataware_image_tag }}"
        dagster_code_location_port: "{{ dagster_dataware_grpc_port }}"
        dagster_code_location_grpc_args: "{{ dagster_dataware_grpc_args }}"
        # Iceberg REST Catalog reached over its internal ClusterIP Service
        # (roles/hive_metastore). Reusing the same RustFS S3 credentials
        # as Hive/Trino (vault_stackable_rustfs_access_key/_secret_key),
        # since this code location needs the same iceberg-warehouse bucket
        # access.
        dagster_code_location_env_secret_data:
          DATAWARE_ICEBERG_REST_URI: "http://hive-metastore-rest-catalog.{{ stackable_namespace }}.svc.cluster.local:9001/iceberg"
          DATAWARE_ICEBERG_WAREHOUSE: "s3a://{{ stackable_rustfs_bucket }}/{{ stackable_iceberg_warehouse_path }}"
          DATAWARE_ICEBERG_NAMESPACE_PROD: "{{ iceberg_namespace_prod }}"
          DATAWARE_ICEBERG_NAMESPACE: "{{ iceberg_namespace_prod }}"
          DATAWARE_S3_ENDPOINT: "{{ dagster_dataware_s3_endpoint }}"
          DATAWARE_S3_ACCESS_KEY_ID: "{{ vault_stackable_rustfs_access_key }}"
          DATAWARE_S3_SECRET_ACCESS_KEY: "{{ vault_stackable_rustfs_secret_key }}"

          DATAWARE_DBT_TARGET: "prod"
          DATAWARE_TRINO_SCHEMA_PROD: "dataware"
          DATAWARE_TRINO_HOST: "{{ trino_domain }}"
          DATAWARE_TRINO_PORT: "443"
          # Password auth (ldap) requires https; for an unauthenticated local Trino use
          # DATAWARE_TRINO_AUTH_METHOD=none and DATAWARE_TRINO_HTTP_SCHEME=http
          DATAWARE_TRINO_HTTP_SCHEME: "https"
          DATAWARE_TRINO_AUTH_METHOD: "ldap"
          DATAWARE_TRINO_USER: "{{ dagster_trino_user }}"
          DATAWARE_TRINO_PASSWORD: "{{ vault_trino_static_users[dagster_trino_user] }}"
          DATAWARE_TRINO_CATALOG: "iceberg"
          DATAWARE_SMARD_SCHEMA: "smard"
          DATAWARE_TRADINGHUB_EU_SCHEMA: "tradinghub_eu"
      when: >-
        dagster_dataware_platform_info.resources is defined and
        dagster_dataware_platform_info.resources | length > 0
