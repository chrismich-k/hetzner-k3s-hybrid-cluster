---
# Example: registers the "tradinghub_eu" code location (private GHCR image,
# built by CI from github_repo_url) with the Dagster platform installed by
# 08_setup_dagster.yaml. This should eventually be replaced by a GitOps
# (ArgoCD) deployment, once one exists - it's the pattern to copy for any
# other code location in the meantime.

- name: Load inventory from Terraform
  import_playbook: playbooks/00_setup_inventory.yaml

- name: Register the "tradinghub_eu" Dagster code location
  hosts: clusters
  become: true
  environment:
    KUBECONFIG: "{{ custom_kubeconfig }}"
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ custom_kubeconfig }}"
  vars:
    iceberg_namespace: "tradinghub_eu"
    dagster_the_location_name: "tradinghub_eu"
    dagster_the_image: "ghcr.io/chrismich-k/ktest-app/dagster-tradinghub-eu"
    dagster_the_image_tag: "latest"
    dagster_the_grpc_port: 3031
    # entry point into the image - adjust to match the actual Python
    # module/attribute the "tradinghub_eu" image exposes
    dagster_the_grpc_args:
      - "-m"
      - "ktest.tradinghub_eu.definitions"
  tasks:
    # Dagster is optional in this repo (08_setup_dagster.yaml) - only
    # register this code location if the platform is actually installed.
    - name: Check whether the Dagster platform is installed
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: dagster-dagster-webserver
        namespace: "{{ dagster_namespace }}"
      register: dagster_the_platform_info
      failed_when: false

    # RustFS's own internal ClusterIP (plain HTTP - pyiceberg/boto3 has no
    # hard TLS requirement, unlike Trino) if used, otherwise Hetzner Object
    # Storage's real HTTPS endpoint.
    - name: Determine the RustFS/S3 endpoint for the Trading Hub Europe code location
      ansible.builtin.set_fact:
        dagster_the_s3_endpoint: >-
          {{ 'http://rustfs-svc.' ~ rustfs_namespace ~ '.svc.cluster.local:9000'
             if stackable_iceberg_storage_backend == 'rustfs'
             else 'https://' ~ stackable_hetzner_object_storage_host ~ ':' ~ stackable_hetzner_object_storage_port }}

    - name: Register the tradinghub_eu code location
      ansible.builtin.include_role:
        name: dagster_code_location
      vars:
        dagster_code_location_name: "{{ dagster_the_location_name }}"
        dagster_code_location_namespace: "{{ dagster_namespace }}"
        dagster_code_location_image: "{{ dagster_the_image }}"
        dagster_code_location_image_tag: "{{ dagster_the_image_tag }}"
        dagster_code_location_port: "{{ dagster_the_grpc_port }}"
        dagster_code_location_grpc_args: "{{ dagster_the_grpc_args }}"
        # Iceberg REST Catalog reached over its internal ClusterIP Service
        # (roles/hive_metastore). Reusing the same RustFS S3 credentials
        # as Hive/Trino (vault_stackable_rustfs_access_key/_secret_key),
        # since this code location needs the same iceberg-warehouse bucket
        # access.
        dagster_code_location_env_secret_data:
          TRADINGHUB_EU_ICEBERG_REST_URI: "http://hive-metastore-rest-catalog.{{ stackable_namespace }}.svc.cluster.local:9001/iceberg"
          TRADINGHUB_EU_ICEBERG_WAREHOUSE: "s3a://{{ stackable_rustfs_bucket }}/{{ stackable_iceberg_warehouse_path }}"
          TRADINGHUB_EU_ICEBERG_NAMESPACE: "{{ iceberg_namespace }}"
          TRADINGHUB_EU_S3_ENDPOINT: "{{ dagster_the_s3_endpoint }}"
          TRADINGHUB_EU_S3_ACCESS_KEY_ID: "{{ vault_stackable_rustfs_access_key }}"
          TRADINGHUB_EU_S3_SECRET_ACCESS_KEY: "{{ vault_stackable_rustfs_secret_key }}"
          THE_USER_AGENT: "ktest-tradinghub-eu/0.1 (+https://github.com/chrismich-k/ktest-app)"
      when: >-
        dagster_the_platform_info.resources is defined and
        dagster_the_platform_info.resources | length > 0
