---
- name: Install Trino
  block:
    - name: Create stackable namespace
      kubernetes.core.k8s:
        name: "{{ stackable_namespace }}"
        kind: Namespace
        state: present

    # this role registers its own Keycloak client
    - name: Ensure Trino client exists in Keycloak
      community.general.keycloak_client:
        auth_keycloak_url: "https://{{ keycloak_domain }}"
        auth_realm: master
        auth_username: "{{ vault_keycloak_bootstrap_admin_user }}"
        auth_password: "{{ vault_keycloak_bootstrap_admin_password }}"
        realm: "{{ realm_name }}"
        client_id: "{{ trino_client_id }}"
        name: "{{ trino_client_id }}"
        enabled: true
        protocol: openid-connect
        public_client: false
        standard_flow_enabled: true
        direct_access_grants_enabled: false
        root_url: "https://{{ trino_domain }}"
        base_url: "https://{{ trino_domain }}"
        # Trino's own OAuth2 callback path - fixed by Trino itself, not
        # configurable (confirmed against trino.io/docs/current/security/oauth2.html)
        redirect_uris:
          - "https://{{ trino_domain }}/oauth2/callback"
        web_origins:
          - "https://{{ trino_domain }}"
        state: present
      register: trino_kc_client_result
      until: trino_kc_client_result is succeeded
      retries: 10
      delay: 15

    - name: Retrieve the Trino client secret from Keycloak
      community.general.keycloak_clientsecret_info:
        auth_keycloak_url: "https://{{ keycloak_domain }}"
        auth_realm: master
        auth_username: "{{ vault_keycloak_bootstrap_admin_user }}"
        auth_password: "{{ vault_keycloak_bootstrap_admin_password }}"
        realm: "{{ realm_name }}"
        client_id: "{{ trino_client_id }}"
      register: trino_kc_clientsecret_result

    - name: Create Trino OIDC client credentials secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: trino-oidc-secret
            namespace: "{{ stackable_namespace }}"
          type: Opaque
          stringData:
            clientId: "{{ trino_client_id }}"
            clientSecret: "{{ trino_kc_clientsecret_result.clientsecret_info.value }}"
      no_log: true

    - name: Create AuthenticationClass for Trino OIDC login
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: authentication.stackable.tech/v1alpha1
          kind: AuthenticationClass
          metadata:
            name: trino-oidc
          spec:
            provider:
              oidc:
                hostname: "{{ keycloak_domain }}"
                port: 443
                rootPath: "/realms/{{ realm_name }}/"
                scopes:
                  - openid
                  - email
                  - profile
                principalClaim: preferred_username
                providerHint: Keycloak
                tls:
                  verification:
                    server:
                      caCert:
                        # no custom secretClass/CA needed for Let's Encrypt
                        webPki: {}

    - name: Create TrinoCluster
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: trino.stackable.tech/v1alpha1
          kind: TrinoCluster
          metadata:
            name: "{{ trino_cluster_name }}"
            namespace: "{{ stackable_namespace }}"
          spec:
            image:
              productVersion: "{{ trino_product_version }}"
            clusterConfig:
              catalogLabelSelector:
                matchLabels:
                  trino: "{{ trino_cluster_name }}"
              authentication:
                - authenticationClass: trino-oidc
                  oidc:
                    clientCredentialsSecret: trino-oidc-secret
              authorization:
                opa:
                  # OpaCluster's own auto-generated discovery ConfigMap
                  # contains the OPA server's connect string.
                  configMapName: opa
                  package: trino
                  # We don't use column masking at all, so just turn it off
                  # instead of adding an unused Rego rule to satisfy it.
                  enableColumnMasking: false
            coordinators:
              roleConfig:
                # NOT external-unstable/external-stable - this repo never
                # exposes a service via NodePort/LoadBalancer, TLS/ingress
                # always terminates at Traefik's hostPort DaemonSet instead
                # (see roles/domain_cert), so the internal-only ClusterIP
                # listener class is what the IngressRoute below targets
                listenerClass: cluster-internal
              configOverrides:
                config.properties:
                  # trust X-Forwarded-* headers sent by Traefik
                  http-server.process-forwarded: "true"
              roleGroups:
                default:
                  replicas: 1
            workers:
              roleGroups:
                default:
                  replicas: 1

    # Iceberg catalog backed by roles/hive_metastore's HiveCluster and the
    # shared stackable-warehouse-s3 S3Connection it created.
    - name: Create Iceberg TrinoCatalog
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: trino.stackable.tech/v1alpha1
          kind: TrinoCatalog
          metadata:
            name: iceberg
            namespace: "{{ stackable_namespace }}"
            labels:
              trino: "{{ trino_cluster_name }}"
          spec:
            connector:
              iceberg:
                metastore:
                  configMap: "{{ hive_cluster_name }}"
                s3:
                  reference: stackable-warehouse-s3

    - name: Set up TLS certificate for Trino
      ansible.builtin.include_role:
        name: domain_cert
      vars:
        domain_cert_domain: "{{ trino_domain }}"
        domain_cert_cert_name: trino-cert
        domain_cert_secret_name: trino-tls-secret
        domain_cert_cert_namespace: "{{ stackable_namespace }}"

    # trino-operator enforces TLS, so Traefik needs to be told to speak
    # HTTPS to that backend and to not validate its self-signed cert.
    - name: Create Traefik ServersTransport for Trino
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: ServersTransport
          metadata:
            name: trino-transport
            namespace: "{{ stackable_namespace }}"
          spec:
            insecureSkipVerify: true

    - name: Create Trino IngressRoute via Traefik CRD
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: trino-ingressroute
            namespace: "{{ stackable_namespace }}"
          spec:
            entryPoints:
              - websecure
            routes:
              - match: "Host(`{{ trino_domain }}`)"
                kind: Rule
                services:
                  - name: "{{ trino_cluster_name }}-coordinator"
                    port: 8443
                    scheme: https
                    serversTransport: trino-transport
            tls:
              secretName: trino-tls-secret
