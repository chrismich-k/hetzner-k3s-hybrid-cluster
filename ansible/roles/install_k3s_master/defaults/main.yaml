---
# Keep regular workloads off the masters with the standard taint
# node-role.kubernetes.io/control-plane:NoSchedule - k3s' own add-ons
# (Traefik, CoreDNS, metrics-server) and the usual DaemonSets tolerate it.
# Set to false for a cluster without agents, where the masters have to run
# everything (also removes the taint again).
install_k3s_master_taint_workloads: true
