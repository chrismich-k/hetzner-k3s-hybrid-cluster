---
- name: Install LetsEncrypt Stack (Cert-Manager /Cluster-Issuer) in Cluster
  block:
    # Cert-Manager
    - name: Add Jetstack Helm repository
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: "https://charts.jetstack.io"

    - name: Install cert-manager via Helm
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        release_namespace: cert-manager
        create_namespace: true
        wait: true
        values:
          installCRDs: true
          tolerations:
            - key: "node.kubernetes.io/network-unavailable"
              operator: "Exists"
              effect: "NoSchedule"

          # webhook component, grouped
          webhook:
            nodeSelector:
              ingress-target: "true"
            tolerations:
              - key: "node.kubernetes.io/network-unavailable"
                operator: "Exists"
                effect: "NoSchedule"

          # cainjector component, grouped
          cainjector:
            nodeSelector:
              ingress-target: "true"
            tolerations:
              - key: "node.kubernetes.io/network-unavailable"
                operator: "Exists"
                effect: "NoSchedule"

    # IMPORTANT: the API server needs a moment to process the new CRDs
    - name: Wait for cert-manager CRDs to be ready
      ansible.builtin.pause:
        seconds: 15

    # Cluster Issuer
    - name: Create Let's Encrypt production ClusterIssuer
      kubernetes.core.k8s:
        state: present
        #        force: true
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              email: "{{ admin_email }}"
              privateKeySecretRef:
                name: letsencrypt-prod-account-key
              solvers:
                - http01:
                    ingress:
                      ingressClassName: traefik
                      podTemplate:
                        spec:
                          nodeSelector:
                            ingress-target: "true"
